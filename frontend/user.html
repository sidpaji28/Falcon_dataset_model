<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #results { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <a href="index.html" class="text-blue-500 hover:underline mb-4 block">&larr; Back to Home</a>
        <h1 class="text-3xl font-bold mb-4 border-b pb-2">User Dashboard</h1>
        <p class="text-gray-700 mb-6">Interact with the JSO Agent to analyze your CV and extract matching job listings using the Gemini API.</p>

        <div class="p-6 border rounded bg-gray-100 mb-6">
            <h2 class="text-xl font-semibold mb-4">Start Search</h2>
            <textarea id="cvInput" rows="4" class="w-full p-2 border rounded mb-4" placeholder="Paste your CV text here..."></textarea>
            <input type="text" id="roleInput" class="w-full p-2 border rounded mb-4" placeholder="Target Role (e.g. AI Engineer)" />
            <input type="text" id="locationInput" class="w-full p-2 border rounded mb-4" placeholder="Target Location (e.g. NY)" />
            <button id="analyzeBtn" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition">Analyze CV & Start Search</button>
        </div>

        <div id="loading" class="hidden text-center text-blue-500 font-bold mb-6">Agent is thinking...</div>

        <div id="results" class="p-6 border rounded bg-green-50">
            <h2 class="text-2xl font-bold mb-4 text-green-800">Agent Results</h2>
            <div class="mb-4">
                <h3 class="font-semibold text-lg">Expanded Skills:</h3>
                <ul id="skillsList" class="list-disc pl-5 text-gray-700"></ul>
            </div>
            <div>
                <h3 class="font-semibold text-lg">Platform Links:</h3>
                <ul id="linksList" class="list-disc pl-5 text-blue-600 break-all"></ul>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const cv = document.getElementById('cvInput').value;
            const role = document.getElementById('roleInput').value || 'Developer';
            const location = document.getElementById('locationInput').value || 'Remote';

            if (!cv) {
                alert("Please paste CV text.");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').style.display = 'none';

            try {
                // 1. Analyze CV
                const cvResponse = await fetch('/api/agent/analyze-cv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: 'user123', cv_text: cv })
                });

                if (!cvResponse.ok) throw new Error("API analysis failed");
                const cvData = await cvResponse.json();
                const skills = cvData.expanded_skills || ['Python'];

                // 2. Start Search
                const searchResponse = await fetch('/api/agent/start-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 'user123',
                        role: role,
                        location: location,
                        experience: 'Mid-Level',
                        skills: skills
                    })
                });

                if (!searchResponse.ok) throw new Error("Search API failed");
                const searchData = await searchResponse.json();

                // Display Results
                const skillsUl = document.getElementById('skillsList');
                skillsUl.innerHTML = '';
                skills.forEach(skill => {
                    const li = document.createElement('li');
                    li.textContent = skill;
                    skillsUl.appendChild(li);
                });

                const linksUl = document.getElementById('linksList');
                linksUl.innerHTML = '';
                (searchData.platform_links || []).forEach(link => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = link;
                    a.target = "_blank";
                    a.textContent = link;
                    a.className = "hover:underline";
                    li.appendChild(a);
                    linksUl.appendChild(li);
                });

                document.getElementById('results').style.display = 'block';
            } catch (err) {
                console.error(err);
                alert("An error occurred communicating with the backend API. Check console.");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
